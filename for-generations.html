        return parseFloat((min + (max - min) * random).toFixed(precision));

        return parseFloat((min + (max - min) * Math.random()).toFixed(precision));
      }
    }

        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        const random = array[0] / 0xFFFFFFFF;
        return Math.floor(min + (max - min + 1) * random);
      } catch {
        return Math.floor(min + (max - min + 1) * Math.random());
      }

        this.state ^= this.state >>> 17;
        this.state ^= this.state << 5;
        return (this.state >>> 0) / 0xFFFFFFFF;
      }
      
      float(min, max, precision = 2) {

      int(min, max) {

      if (!vibe || !items || items.length === 0) {

      }
      
      // Get compatible items
      const compatible = items.filter(item => compatibilityFunc(item, vibe));
      
      // If no compatible items found, fall back to all items
      const candidates = compatible.length > 0 ? compatible : items;
      
      // Weight compatible items higher (70% chance) vs random (30% chance)

      const errors = [];

      ['subjects', 'poses', 'expressions', 'locations', 'styles', 'loras'].forEach(bucket => {
        if (!fullData[bucket] || fullData[bucket].length === 0) {
          errors.push(`${bucket} cannot be empty`);
        }
      });
      
      // Check for duplicates (case-insensitive)
      ['subjects', 'poses', 'expressions', 'locations', 'styles'].forEach(bucket => {
        const items = fullData[bucket] || [];
        const descriptions = items.map(item => 
          (item.description || item.text || '').toLowerCase()
        );
        const uniqueDescriptions = new Set(descriptions);
        if (descriptions.length !== uniqueDescriptions.size) {
          errors.push(`Duplicate descriptions found in ${bucket}`);
        }
      });
      
      // Check LoRA names for duplicates
      const loraNames = (fullData.loras || []).map(lora => lora.name.toLowerCase());
      const uniqueLoraNames = new Set(loraNames);
      if (loraNames.length !== uniqueLoraNames.size) {
        errors.push('Duplicate LoRA names found');
      }
      
      // Check weight ranges
      ['expressions', 'loras'].forEach(bucket => {
        const items = fullData[bucket] || [];
        items.forEach(item => {
          if (item.weightRange && item.weightRange.length === 2) {
            const [min, max] = item.weightRange;
            if (min > max) {
              errors.push(`Invalid weight range in ${bucket}: min (${min}) > max (${max})`);
            }
          }
        });
      });
      
      // Check location details (max 3)
      const locations = fullData.locations || [];
      locations.forEach(location => {
        const details = location.text.split(',').length;
        if (details > 3) {
          errors.push(`Location "${location.text.substring(0, 30)}..." has too many details (${details}, max 3)`);
        }
      });
      
      return errors;
    }

                        type="number"
                        value={seedValue || ''}
                        onChange={(e) => setSeedValue(e.target.value ? parseInt(e.target.value) : null)}
                        placeholder="Enter seed (32-bit integer)"
                        className="w-full bg-surface-700/50 border border-surface-600/50 focus:border-primary-500/50 rounded-lg p-3 text-sm text-slate-200 placeholder-slate-500 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500/20"
                      />
                      <div className="text-xs text-slate-500 mt-2">
                        Leave empty for random seed
                      </div>
                    </div>
                  )}
                </div>
                
                {/* Locks */}
                <div className="bg-surface-800/60 backdrop-blur-sm border border-surface-700/50 rounded-xl p-6 shadow-soft">
                  <h3 className="text-lg font-semibold text-slate-200 mb-4 flex items-center">
                    <span className="w-2 h-2 bg-amber-500 rounded-full mr-3"></span>
                    Lock Per-Bucket
                  </h3>
                  
                  <div className="space-y-3">
                    {Object.entries(locks).map(([key, value]) => (
                      <label key={key} className="flex items-center space-x-3 cursor-pointer group">
                        <div className="relative">
                          <input
                            type="checkbox"
                            checked={value}
                            onChange={(e) => setLocks(prev => ({ ...prev, [key]: e.target.checked }))}
                            className="sr-only"
                          />
                          <div className={`w-5 h-5 rounded border-2 transition-all duration-200 ${
                            value 
                              ? 'bg-amber-500 border-amber-500' 
                              : 'bg-transparent border-surface-600 group-hover:border-amber-500/50'
                          }`}>
                            {value && (
                              <svg className="w-3 h-3 text-white m-0.5" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clipRule="evenodd" />
                              </svg>
                            )}
                          </div>
                        </div>
                        <span className="text-sm text-slate-200 group-hover:text-slate-100 transition-colors">
                          Lock {key.charAt(0).toUpperCase() + key.slice(1)}
                        </span>
                      </label>
                    ))}
                  </div>
                </div>

                {/* Generate Button */}
                <button
                  onClick={generatePrompt}
                  className="w-full bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 text-white font-semibold py-4 px-8 rounded-xl transition-all duration-200 shadow-soft hover:shadow-medium focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:ring-offset-2 focus:ring-offset-surface-900"
                >
                  Generate Prompt
                </button>

                {/* Re-roll Buttons */}
                {currentGeneration.selection && (
                  <div className="grid grid-cols-2 gap-2">
                    {Object.keys(locks).map(bucket => (
                      <button
                        key={bucket}
                        onClick={() => {
                          // Re-roll specific bucket
                          const rng = toggles.lockSeed && seedValue ? new XorShift32(seedValue) : null;
                          const newSelection = { ...currentGeneration.selection };
                          
                          if (bucket === 'subject') {
                            newSelection.subject = rng ? rng.choice(catalog.subjects) : randomChoice(catalog.subjects);
                          } else if (bucket === 'pose') {
                            newSelection.pose = rng ? rng.choice(catalog.poses) : randomChoice(catalog.poses);
                          } else if (bucket === 'expression') {
                            newSelection.expression = rng ? rng.choice(catalog.expressions) : randomChoice(catalog.expressions);
                          } else if (bucket === 'location') {
                            newSelection.location = rng ? rng.choice(catalog.locations) : randomChoice(catalog.locations);
                          } else if (bucket === 'style') {
                            newSelection.styles = [rng ? rng.choice(catalog.styles) : randomChoice(catalog.styles)];
                          }
                          
                          const selectedLoRAs = pickLoRAs(catalog.loras, loraCount, 5, rng);
                          const prompt = assemblePrompt(newSelection, selectedLoRAs, { enabled: toggles.styleBlend });
                          const negative = assembleNegatives(newSelection, toggles.includeStyleExprNegatives);
                          const settings = formatSettings(toggles.randomizeSettings, toggles.lockSeed ? seedValue : null);
                          
                          const generation = {
                            prompt,
                            negative,
                            settings: JSON.stringify(settings, null, 2),
                            selection: newSelection,
                            loras: selectedLoRAs,
                            timestamp: new Date().toISOString()
                          };
                          
                          setCurrentGeneration(generation);
                        }}
                        className="bg-surface-700/50 hover:bg-surface-700 text-slate-200 border border-surface-600/50 hover:border-primary-500/50 py-2 px-3 text-xs rounded-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-primary-500/50"
                        disabled={locks[bucket]}
                      >
                        Re-roll {bucket.charAt(0).toUpperCase() + bucket.slice(1)}
                      </button>
                    ))}
                  </div>
                )}
                
                {/* Output */}
                {currentGeneration.prompt && (
                  <div className="space-y-6">
                    <div className="bg-surface-800/60 backdrop-blur-sm border border-surface-700/50 rounded-xl p-6 shadow-soft">
                      <div className="flex justify-between items-center mb-4">
                        <label className="text-lg font-semibold text-slate-200 flex items-center">
                          <span className="w-2 h-2 bg-primary-500 rounded-full mr-3"></span>
                          Prompt
                        </label>
                        <button
                          onClick={() => copyToClipboard(currentGeneration.prompt, 'Prompt')}
                          className="bg-primary-600 hover:bg-primary-700 text-white px-3 py-1.5 text-xs font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500/50"
                        >
                          Copy
                        </button>
                      </div>
                      <textarea
                        value={currentGeneration.prompt}
                        readOnly
                        className="w-full h-32 bg-surface-700/50 border border-surface-600/50 rounded-lg p-4 text-sm font-mono text-slate-200 resize-none focus:outline-none scrollbar-thin scrollbar-track-surface-700 scrollbar-thumb-surface-600"
                      />
                    </div>
                    
                    <div className="bg-surface-800/60 backdrop-blur-sm border border-surface-700/50 rounded-xl p-6 shadow-soft">
                      <div className="flex justify-between items-center mb-4">
                        <label className="text-lg font-semibold text-slate-200 flex items-center">
                          <span className="w-2 h-2 bg-red-500 rounded-full mr-3"></span>
                          Negative Prompt
                        </label>
                        <button
                          onClick={() => copyToClipboard(currentGeneration.negative, 'Negative Prompt')}
                          className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 text-xs font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-red-500/50"
                        >
                          Copy
                        </button>
                      </div>
                      <textarea
                        value={currentGeneration.negative}
                        readOnly
                        className="w-full h-24 bg-surface-700/50 border border-surface-600/50 rounded-lg p-4 text-sm font-mono text-slate-200 resize-none focus:outline-none scrollbar-thin scrollbar-track-surface-700 scrollbar-thumb-surface-600"
                      />
                    </div>
                    
                    <div className="bg-surface-800/60 backdrop-blur-sm border border-surface-700/50 rounded-xl p-6 shadow-soft">
                      <div className="flex justify-between items-center mb-4">
                        <label className="text-lg font-semibold text-slate-200 flex items-center">
                          <span className="w-2 h-2 bg-emerald-500 rounded-full mr-3"></span>
                          Settings
                        </label>
                        <button
                          onClick={() => copyToClipboard(currentGeneration.settings, 'Settings')}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 text-xs font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
                        >
                          Copy
                        </button>
                      </div>
                      <textarea
                        value={currentGeneration.settings}
                        readOnly
                        className="w-full h-32 bg-surface-700/50 border border-surface-600/50 rounded-lg p-4 text-sm font-mono text-slate-200 resize-none focus:outline-none scrollbar-thin scrollbar-track-surface-700 scrollbar-thumb-surface-600"
                      />
                    </div>
                    
                    {/* Export Buttons */}
                    <div className="grid grid-cols-2 gap-4">
                      <button
                        onClick={() => {
                          const content = `Prompt:\n${currentGeneration.prompt}\n\nNegative Prompt:\n${currentGeneration.negative}\n\nSettings:\n${currentGeneration.settings}`;
                          const blob = new Blob([content], { type: 'text/plain' });
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = `generation-${Date.now()}.txt`;
                          a.click();
                          URL.revokeObjectURL(url);
                        }}
                        className="bg-surface-700/50 hover:bg-surface-700 text-slate-200 border border-surface-600/50 hover:border-violet-500/50 py-3 px-4 text-sm font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-violet-500/50"
                      >
                        📄 Download .txt
                      </button>
                      <button
                        onClick={() => {
                          const content = JSON.stringify(getMergedCatalog(userData), null, 2);
                          const blob = new Blob([content], { type: 'application/json' });
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = `catalog-${Date.now()}.json`;
                          a.click();
                          URL.revokeObjectURL(url);
                        }}
                        className="bg-surface-700/50 hover:bg-surface-700 text-slate-200 border border-surface-600/50 hover:border-orange-500/50 py-3 px-4 text-sm font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-orange-500/50"
                      >
                        📦 Download .json
                      </button>
                    </div>
                  </div>
                )}

                {/* History */}
                {history.length > 0 && (
                  <div className="bg-surface-800/60 backdrop-blur-sm border border-surface-700/50 rounded-xl p-6 shadow-soft">
                    <h3 className="text-lg font-semibold text-slate-200 mb-4 flex items-center">
                      <span className="w-2 h-2 bg-purple-500 rounded-full mr-3"></span>
                      History ({history.length}/20)
                    </h3>
                    <div className="max-h-52 overflow-y-auto space-y-3 scrollbar-thin scrollbar-track-surface-800 scrollbar-thumb-surface-600">
                      {history.slice(-5).reverse().map((generation, index) => (
                        <div key={generation.timestamp} className="p-3 bg-surface-700/30 hover:bg-surface-700/50 border border-surface-600/30 rounded-lg group transition-all duration-200">
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-xs font-medium text-slate-300">
                              {new Date(generation.timestamp).toLocaleTimeString()}
                            </span>
                            <button
                              onClick={() => {
                                setCurrentGeneration(generation);
                                // Parse settings back to update UI state if needed
                                try {
                                  const settings = JSON.parse(generation.settings);
                                  setSeedValue(settings.seed);
                                } catch (e) {
                                  console.error('Failed to parse settings:', e);
                                }
                              }}
                              className="text-xs text-purple-400 hover:text-purple-300 px-2 py-1 rounded border border-purple-500/20 hover:border-purple-500/50 transition-colors focus:outline-none focus:ring-2 focus:ring-purple-500/50"
                            >
                              Restore
                            </button>
                          </div>
                          <div className="text-xs text-slate-500 truncate">
                            {generation.prompt.substring(0, 80)}...
                          </div>
                        </div>
                      ))}
                      {history.length > 5 && (
                        <div className="text-xs text-purple-400 text-center py-2 border-t border-surface-600/30">
                          ...and {history.length - 5} more in history
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
