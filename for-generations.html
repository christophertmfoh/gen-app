    /* RNG & Utility Functions */
    function rngFloat(min, max, precision = 2) {
      const random = crypto?.getRandomValues ? 
        crypto.getRandomValues(new Uint32Array(1))[0] / (2**32) : 
        Math.random();
      return parseFloat((random * (max - min) + min).toFixed(precision));
    }

    function rngInt(min, max) {
      const random = crypto?.getRandomValues ? 
        crypto.getRandomValues(new Uint32Array(1))[0] / (2**32) : 
        Math.random();
      return Math.floor(random * (max - min + 1)) + min;
    }

    function randomChoice(list) {
      return list[rngInt(0, list.length - 1)];
    }

    // Seeded PRNG for locked seed (xorshift32)
    class SeededRNG {
      constructor(seed) {
        this.state = seed || 1;
      }
      
      next() {
        this.state ^= this.state << 13;
        this.state ^= this.state >>> 17;
        this.state ^= this.state << 5;
        return (this.state >>> 0) / (2**32);
      }
      
      float(min, max, precision = 2) {
        return parseFloat((this.next() * (max - min) + min).toFixed(precision));
      }
      
      int(min, max) {
        return Math.floor(this.next() * (max - min + 1)) + min;
      }
      
      choice(list) {
        return list[this.int(0, list.length - 1)];
      }
    }

    /* Local Storage Functions */
    function loadUserData() {
      try {
        const stored = localStorage.getItem('fg.userData.v1');
        return stored ? JSON.parse(stored) : { subjects: [], poses: [], expressions: [], locations: [], styles: [], loras: [] };
      } catch {
        return { subjects: [], poses: [], expressions: [], locations: [], styles: [], loras: [] };
      }
    }

    function saveUserData(userData) {
      localStorage.setItem('fg.userData.v1', JSON.stringify(userData));
    }

    function loadHistory() {
      try {
        const stored = localStorage.getItem('fg.history.v1');
        return stored ? JSON.parse(stored) : [];
      } catch {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem('fg.history.v1', JSON.stringify(history.slice(-20)));
    }

    /* Generation Logic */
    function pickLoRAs(allLoRAs, desiredCount, cap = 5) {
      const clampedCount = Math.max(0, Math.min(desiredCount, cap));
      if (clampedCount === 0) return [];
      
      const availableLoRAs = [...allLoRAs];
      const selected = [];
      
      for (let i = 0; i < clampedCount && availableLoRAs.length > 0; i++) {
        const randomIndex = rngInt(0, availableLoRAs.length - 1);
        const lora = availableLoRAs.splice(randomIndex, 1)[0];
        const weight = rngFloat(lora.weightRange[0], lora.weightRange[1]);
        selected.push({ ...lora, selectedWeight: weight });
      }
      
      return selected;
    }

    function applyNoRepeat(bucketName, list, usedSets, noRepeat) {
      if (!noRepeat) return randomChoice(list);
      
      if (!usedSets[bucketName]) usedSets[bucketName] = new Set();
      const used = usedSets[bucketName];
      
      const available = list.filter(item => !used.has(item.id));
      if (available.length === 0) {
        used.clear();
        return randomChoice(list);
      }
      
      const chosen = randomChoice(available);
      used.add(chosen.id);
      return chosen;
    }

    function assemblePrompt(selection, selectedLoRAs, blendStyles) {
      const basePrompt = "1girl, score_9, score_8_up, score_7_up, score_6_up, score_5_up, score_4_up, source_anime, rating_explicit, (1girl:1.3)";
      
      let parts = [basePrompt];
      
      // Subject
      if (selection.subject) {
        parts.push(selection.subject.description);
      }
      
      // Expression (after subject, before pose)
      if (selection.expression) {
        const shouldWeight = Math.random() < 0.5;
        if (shouldWeight && selection.expression.weightRange) {
          const weight = rngFloat(selection.expression.weightRange[0], selection.expression.weightRange[1]);
          parts.push(`(${selection.expression.text.replace('with ', '')}:${weight})`);
        } else {
          parts.push(selection.expression.text);
        }
      }
      
      // Pose
      if (selection.pose) {
        parts.push(`${selection.pose.text}, ${selection.pose.angle}`);
      }
      
      // Location
      if (selection.location) {
        parts.push(`in ${selection.location.text}`);
      }
      
      // Style(s)
      if (selection.styles && selection.styles.length > 0) {
        if (blendStyles && selection.styles.length > 1) {
          // Blend styles with weights
          const styleTexts = selection.styles.map((style, index) => {
            if (index === 0) {
              return `${style.text}:1.2`;
            } else {
              return `${style.text}:0.8`;
            }
          });
          parts.push(styleTexts.join(', '));
        } else {
          parts.push(selection.styles[0].text);
        }
      }
      
      // LoRAs
      const loraStrings = selectedLoRAs.map(lora => {
        const loraTag = `<lora:${lora.name}:${lora.selectedWeight}>`;
        let triggerText = '';
        
        if (lora.triggers && lora.triggers.length > 0) {
          triggerText = lora.triggers.join(', ');
        }
        
        // Special handling for tattoo LoRA
        if (lora.name.toLowerCase().includes('tattoo') && lora.tattooPlacements) {
          const placement = randomChoice(lora.tattooPlacements);
          triggerText += `, tattoos on ${placement}`;
        }
        
        return triggerText ? `${loraTag}, ${triggerText}` : loraTag;
      });
      
      if (loraStrings.length > 0) {
        parts.push(loraStrings.join(', '));
      }
      
      return parts.join(', ');
    }

    function assembleNegatives(selection, includeStyleExpr) {
      let negatives = [...packetData.negatives.standard];
      
      if (includeStyleExpr) {
        // Add style-specific negatives
        if (selection.styles && selection.styles.length > 0) {
          selection.styles.forEach(style => {
            const styleKey = style.text.split(',')[0].trim();
            const styleNegatives = packetData.negatives.byStyle[styleKey];
            if (styleNegatives && Math.random() < 0.5) {
              negatives.push(...styleNegatives);
            }
          });
        }
        
        // Add expression-specific negatives
        if (selection.expression) {
          const exprKey = selection.expression.text.split(',')[0].replace('with ', '').trim();
          const exprNegatives = packetData.negatives.byExpression[exprKey];
          if (exprNegatives && Math.random() < 0.5) {
            negatives.push(...exprNegatives);
          }
        }
      }
      
      return negatives.join(', ');
    }

    function formatSettings(randomizeSettings, lockedSeed) {
      const settings = {
        "Model": "Perfect Pony XL V6",
        "Sampler": randomizeSettings ? randomChoice(["Euler a", "DPM++ 2M"]) : "Euler a",
        "Steps": randomizeSettings ? rngInt(25, 40) : 25,
        "CFG": randomizeSettings ? rngFloat(7, 9, 1) : 7,
        "Hires Strength": randomizeSettings ? rngFloat(0.3, 0.5, 1) : 0.3,
        "Aspect Ratio": randomizeSettings ? randomChoice(["512×768", "1024×1536"]) : "512×768",
        "CLIP Skip": -2,
        "Prompt Enhance": true,
        "Prompt Behavior": "V2 Unlimited",
        "Upscaler": "REAL-ESRGAN-X4-ANIME-CFORMER",
        "Seed": lockedSeed !== null ? lockedSeed : rngInt(1, 2147483647)
      };
      
      return JSON.stringify(settings, null, 2);
    }

    /* React Components */
    const { useState, useEffect, useMemo } = React;

    function App() {
      const [userData, setUserData] = useState(loadUserData());
      const [history, setHistory] = useState(loadHistory());
      const [usedSets, setUsedSets] = useState({});
      
      // Generator state
      const [locks, setLocks] = useState({
        subject: false,
        pose: false,
        expression: false,
        location: false,
        style: false
      });
      
      const [toggles, setToggles] = useState({
        noRepeat: true,
        styleBlend: false,
        includeNegatives: true,
        randomizeSettings: false,
        lockSeed: false
      });
      
      const [loraCount, setLoraCount] = useState(2);
      const [lockedSeed, setLockedSeed] = useState(null);
      const [currentSelection, setCurrentSelection] = useState({});
      const [currentPrompt, setCurrentPrompt] = useState('');
      const [currentNegative, setCurrentNegative] = useState('');
      const [currentSettings, setCurrentSettings] = useState('');
      const [activeTab, setActiveTab] = useState('subjects');
      
      // Add item state
      const [addItemData, setAddItemData] = useState({});

      // Merge data
      const mergedData = useMemo(() => {
        const merged = {};
        Object.keys(packetData).forEach(key => {
          if (key === 'negatives') {
            merged[key] = packetData[key];
          } else {
            merged[key] = [...packetData[key], ...(userData[key] || [])];
          }
        });
        return merged;
      }, [userData]);

      const generatePrompt = () => {
        const selection = {};
        
        // Select items (respecting locks)
        if (!locks.subject || !currentSelection.subject) {
          selection.subject = applyNoRepeat('subjects', mergedData.subjects, usedSets, toggles.noRepeat);
        } else {
          selection.subject = currentSelection.subject;
        }
        
        if (!locks.pose || !currentSelection.pose) {
          selection.pose = applyNoRepeat('poses', mergedData.poses, usedSets, toggles.noRepeat);
        } else {
          selection.pose = currentSelection.pose;
        }
        
        if (!locks.expression || !currentSelection.expression) {
          selection.expression = applyNoRepeat('expressions', mergedData.expressions, usedSets, toggles.noRepeat);
        } else {
          selection.expression = currentSelection.expression;
        }
        
        if (!locks.location || !currentSelection.location) {
          selection.location = applyNoRepeat('locations', mergedData.locations, usedSets, toggles.noRepeat);
        } else {
          selection.location = currentSelection.location;
        }
        
        if (!locks.style || !currentSelection.styles) {
          if (toggles.styleBlend) {
            const styleCount = Math.random() < 0.1 ? 3 : 2; // 10% chance for 3 styles
            selection.styles = [];
            for (let i = 0; i < styleCount && i < mergedData.styles.length; i++) {
              const style = applyNoRepeat(`styles_${i}`, mergedData.styles.filter(s => !selection.styles.includes(s)), usedSets, toggles.noRepeat);
              if (style) selection.styles.push(style);
            }
          } else {
            selection.styles = [applyNoRepeat('styles', mergedData.styles, usedSets, toggles.noRepeat)];
          }
        } else {
          selection.styles = currentSelection.styles;
        }
        
        // Select LoRAs
        const selectedLoRAs = pickLoRAs(mergedData.loras, loraCount);
        
        // Generate outputs
        const prompt = assemblePrompt(selection, selectedLoRAs, toggles.styleBlend);
        const negative = assembleNegatives(selection, toggles.includeNegatives);
        const settings = formatSettings(toggles.randomizeSettings, toggles.lockSeed ? lockedSeed : null);
        
        // Update state
        setCurrentSelection(selection);
        setCurrentPrompt(prompt);
        setCurrentNegative(negative);
        setCurrentSettings(settings);
        
        // Add to history
        const historyEntry = {
          id: Date.now(),
          timestamp: new Date().toISOString(),
          prompt,
          negative,
          settings,
          selection,
          selectedLoRAs
        };
        
        const newHistory = [historyEntry, ...history].slice(0, 20);
        setHistory(newHistory);
        saveHistory(newHistory);
        
        // Update locked seed if not set
        if (toggles.lockSeed && !lockedSeed) {
          const seedMatch = settings.match(/"Seed":\s*(\d+)/);
          if (seedMatch) {
            setLockedSeed(parseInt(seedMatch[1]));
          }
        }

        setUsedSets({...usedSets});
      };

      const rerollBucket = (bucketName) => {
        const newSelection = { ...currentSelection };
        
        switch (bucketName) {
          case 'subject':
            newSelection.subject = applyNoRepeat('subjects', mergedData.subjects, usedSets, toggles.noRepeat);
            break;
          case 'pose':
            newSelection.pose = applyNoRepeat('poses', mergedData.poses, usedSets, toggles.noRepeat);
            break;
          case 'expression':
            newSelection.expression = applyNoRepeat('expressions', mergedData.expressions, usedSets, toggles.noRepeat);
            break;
          case 'location':
            newSelection.location = applyNoRepeat('locations', mergedData.locations, usedSets, toggles.noRepeat);
            break;
          case 'style':
            if (toggles.styleBlend) {
              const styleCount = Math.random() < 0.1 ? 3 : 2;
              newSelection.styles = [];
              for (let i = 0; i < styleCount && i < mergedData.styles.length; i++) {
                const style = applyNoRepeat(`styles_${i}`, mergedData.styles.filter(s => !newSelection.styles.includes(s)), usedSets, toggles.noRepeat);
                if (style) newSelection.styles.push(style);
              }
            } else {
              newSelection.styles = [applyNoRepeat('styles', mergedData.styles, usedSets, toggles.noRepeat)];
            }
            break;
          case 'loras':
            const selectedLoRAs = pickLoRAs(mergedData.loras, loraCount);
            const prompt = assemblePrompt(newSelection, selectedLoRAs, toggles.styleBlend);
            setCurrentPrompt(prompt);
            return;
        }
        
        const selectedLoRAs = pickLoRAs(mergedData.loras, loraCount);
        const prompt = assemblePrompt(newSelection, selectedLoRAs, toggles.styleBlend);
        const negative = assembleNegatives(newSelection, toggles.includeNegatives);
        
        setCurrentSelection(newSelection);
        setCurrentPrompt(prompt);
        setCurrentNegative(negative);
      };

      const copyToClipboard = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          // Fallback for older browsers
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }
      };

      const addItem = (bucket) => {
        const data = addItemData[bucket];
        if (!data) return;
        
        let newItem;
        const newId = Math.max(...mergedData[bucket].map(item => item.id), 0) + 1;
        
        switch (bucket) {
          case 'subjects':
            if (!data.description) return;
            newItem = { id: newId, description: data.description };
            break;
          case 'poses':
            if (!data.text || !data.angle) return;
            newItem = { id: newId, text: data.text, angle: data.angle };

            newItem = { id: newId, text: data.text };

          case 'styles':
            if (!data.text) return;
            newItem = { id: newId, text: data.text };
            break;
          case 'loras':
            if (!data.name || !data.triggers || !data.weightMin || !data.weightMax) return;
            newItem = {
              id: newId,
              name: data.name,
              triggers: data.triggers.split(',').map(t => t.trim()),
              weightRange: [parseFloat(data.weightMin), parseFloat(data.weightMax)],

              tattooPlacements: data.tattooPlacements ? data.tattooPlacements.split(',').map(t => t.trim()) : undefined
            };
            break;
          default:
            return;
        }
        
        const newUserData = { ...userData };
        newUserData[bucket] = [...(newUserData[bucket] || []), newItem];
        setUserData(newUserData);
        saveUserData(newUserData);
        
        // Clear form
        setAddItemData({ ...addItemData, [bucket]: {} });
      };

        if (type === 'txt') {
          const content = `Prompt:\n${currentPrompt}\n\nNegative Prompt:\n${currentNegative}\n\nSettings:\n${currentSettings}`;
          const blob = new Blob([content], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');

          const blob = new Blob([content], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'for-generations-catalog.json';
          a.click();
          URL.revokeObjectURL(url);
        }
      };

      return React.createElement('div', { className: 'min-h-screen bg-zinc-950 text-zinc-100' },
        // Header
        React.createElement('div', { className: 'border-b border-zinc-800 bg-zinc-900' },
          React.createElement('div', { className: 'container mx-auto px-4 py-6' },
            React.createElement('div', { className: 'text-center' },
              React.createElement('h1', { className: 'text-4xl font-bold text-cyan-400 mb-2' }, 'For Generations'),
              React.createElement('p', { className: 'text-xl text-zinc-300 mb-4' }, 'Pony V6 XL Prompt Generator'),
              React.createElement('div', { className: 'bg-red-900 border border-red-700 rounded-lg p-3 max-w-2xl mx-auto' },
                React.createElement('p', { className: 'text-red-200 font-semibold text-sm' }, 
                  '⚠️ For adult characters only. Do not create harmful or illegal content.')
              )
            )
          )
        ),
        
        // Main content
        React.createElement('div', { className: 'container mx-auto px-4 py-6' },
          React.createElement('div', { className: 'grid lg:grid-cols-2 gap-8' },
            
            // Left column: Catalog
            React.createElement('div', { className: 'space-y-6' },
              React.createElement('h2', { className: 'text-2xl font-bold text-cyan-400' }, 'Catalog'),

                ['subjects', 'poses', 'expressions', 'locations', 'styles', 'loras'].map(tab =>

                    key: tab,
                    className: `px-4 py-2 rounded-lg transition-colors capitalize ${
                      activeTab === tab 
                        ? 'bg-cyan-600 text-white focus:ring-2 focus:ring-cyan-400' 
                        : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700 focus:ring-2 focus:ring-zinc-600'
                    }`,
                    onClick: () => setActiveTab(tab),
                    'aria-label': `View ${tab} catalog`
                  }, `${tab} (${mergedData[tab].length})`)
                )
              ),
              
              // Tab content
              React.createElement('div', { className: 'bg-zinc-900 rounded-lg p-4 max-h-96 overflow-y-auto' },
                React.createElement('div', { className: 'space-y-2' },
                  mergedData[activeTab].map(item =>
                    React.createElement('div', { 
                      key: item.id, 
                      className: 'p-2 bg-zinc-800 rounded text-sm border-l-2 border-cyan-500'
                    }, 
                      React.createElement('div', { className: 'font-medium text-cyan-300' }, 
                        `${activeTab.slice(0, -1).toUpperCase()} ${item.id}`
                      ),
                      React.createElement('div', { className: 'text-zinc-300 mt-1' },
                        item.description || item.text || item.name || ''
                      ),
                      activeTab === 'loras' && React.createElement('div', { className: 'text-xs text-zinc-400 mt-1' },
                        `Triggers: ${item.triggers?.join(', ') || 'None'} | Weight: ${item.weightRange?.join('-') || 'N/A'}`
                      )
                    )
                  )
                )
              ),
              
              // Add item section
              React.createElement('div', { className: 'bg-zinc-900 rounded-lg p-4' },
                React.createElement('h3', { className: 'text-lg font-semibold text-cyan-400 mb-3' }, `Add ${activeTab.slice(0, -1)}`),
                React.createElement('div', { className: 'space-y-3' },
                  // Dynamic form fields based on activeTab
                  (() => {
                    const data = addItemData[activeTab] || {};
                    const updateField = (field, value) => {
                      setAddItemData({
                        ...addItemData,
                        [activeTab]: { ...data, [field]: value }
                      });
                    };
                    
                    switch (activeTab) {
                      case 'subjects':
                        return React.createElement('div', null,
                          React.createElement('textarea', {
                            className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 resize-none focus:ring-2 focus:ring-cyan-400',
                            placeholder: 'Enter subject description...',
                            rows: 3,
                            value: data.description || '',
                            onChange: (e) => updateField('description', e.target.value),
                            'aria-label': 'Subject description'
                          })
                        );
                      case 'poses':
                        return React.createElement('div', { className: 'space-y-2' },
                          React.createElement('input', {
                            className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                            placeholder: 'Pose description...',
                            value: data.text || '',
                            onChange: (e) => updateField('text', e.target.value),
                            'aria-label': 'Pose description'
                          }),
                          React.createElement('input', {
                            className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                            placeholder: 'Camera angle...',
                            value: data.angle || '',
                            onChange: (e) => updateField('angle', e.target.value),
                            'aria-label': 'Camera angle'
                          })
                        );
                      case 'expressions':
                        return React.createElement('div', { className: 'space-y-2' },
                          React.createElement('input', {
                            className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                            placeholder: 'Expression description...',
                            value: data.text || '',
                            onChange: (e) => updateField('text', e.target.value),
                            'aria-label': 'Expression description'
                          }),
                          React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
                            React.createElement('input', {
                              className: 'bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                              type: 'number',
                              step: '0.1',
                              placeholder: 'Min weight',
                              value: data.weightMin || '',
                              onChange: (e) => updateField('weightMin', e.target.value),
                              'aria-label': 'Minimum weight'
                            }),
                            React.createElement('input', {
                              className: 'bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                              type: 'number',
                              step: '0.1',
                              placeholder: 'Max weight',
                              value: data.weightMax || '',
                              onChange: (e) => updateField('weightMax', e.target.value),
                              'aria-label': 'Maximum weight'
                            })
                          )
                        );
                      case 'locations':
                        return React.createElement('textarea', {
                          className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 resize-none focus:ring-2 focus:ring-cyan-400',
                          placeholder: 'Location description (2-3 details max)...',
                          rows: 2,
                          value: data.text || '',
                          onChange: (e) => updateField('text', e.target.value),
                          'aria-label': 'Location description'
                        });
                      case 'styles':
                        return React.createElement('textarea', {
                          className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 resize-none focus:ring-2 focus:ring-cyan-400',
                          placeholder: 'Style description...',
                          rows: 2,
                          value: data.text || '',
                          onChange: (e) => updateField('text', e.target.value),
                          'aria-label': 'Style description'
                        });
                      case 'loras':
                        return React.createElement('div', { className: 'space-y-2' },
                          React.createElement('input', {
                            className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                            placeholder: 'LoRA name...',
                            value: data.name || '',
                            onChange: (e) => updateField('name', e.target.value),
                            'aria-label': 'LoRA name'
                          }),
                          React.createElement('input', {
                            className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                            placeholder: 'Triggers (comma-separated)...',
                            value: data.triggers || '',
                            onChange: (e) => updateField('triggers', e.target.value),
                            'aria-label': 'LoRA triggers'
                          }),
                          React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
                            React.createElement('input', {
                              className: 'bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                              type: 'number',
                              step: '0.1',
                              placeholder: 'Min weight',
                              value: data.weightMin || '',
                              onChange: (e) => updateField('weightMin', e.target.value),
                              'aria-label': 'Minimum weight'
                            }),
                            React.createElement('input', {
                              className: 'bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                              type: 'number',
                              step: '0.1',
                              placeholder: 'Max weight',
                              value: data.weightMax || '',
                              onChange: (e) => updateField('weightMax', e.target.value),
                              'aria-label': 'Maximum weight'
                            })
                          ),
                          React.createElement('input', {
                            className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                            placeholder: 'Notes (optional)...',
                            value: data.notes || '',
                            onChange: (e) => updateField('notes', e.target.value),
                            'aria-label': 'Notes'
                          }),
                          React.createElement('input', {
                            className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 focus:ring-2 focus:ring-cyan-400',
                            placeholder: 'Tattoo placements (comma-separated, optional)...',
                            value: data.tattooPlacements || '',
                            onChange: (e) => updateField('tattooPlacements', e.target.value),
                            'aria-label': 'Tattoo placements'
                          })
                        );
                      default:
                        return null;
                    }
                  })(),
                  
                  React.createElement('div', { className: 'flex gap-2' },
                    React.createElement('button', {
                      className: 'px-4 py-2 bg-cyan-600 hover:bg-cyan-700 rounded-lg transition-colors focus:ring-2 focus:ring-cyan-400',
                      onClick: () => addItem(activeTab)
                    }, 'Add'),
                    React.createElement('button', {
                      className: 'px-4 py-2 bg-amber-600 hover:bg-amber-700 rounded-lg transition-colors focus:ring-2 focus:ring-amber-400',
                      onClick: () => {
                        // Simple validation - just check for empty required fields
                        const errors = [];
                        if (mergedData[activeTab].length === 0) {
                          errors.push(`No ${activeTab} found`);
                        }
                        alert(errors.length ? `Issues:\n${errors.join('\n')}` : 'Basic validation passed!');
                      }
                    }, 'Validate')
                  )
                )
              )
            ),
            
            // Right column: Generator
            React.createElement('div', { className: 'space-y-6' },
              React.createElement('h2', { className: 'text-2xl font-bold text-cyan-400' }, 'Generator'),
              
              // Controls
              React.createElement('div', { className: 'bg-zinc-900 rounded-lg p-4 space-y-4' },
                React.createElement('h3', { className: 'text-lg font-semibold text-cyan-400' }, 'Controls'),
                
                // Toggles
                React.createElement('div', { className: 'grid grid-cols-1 gap-3' },
                  Object.entries({
                    'No-repeat per bucket': 'noRepeat',
                    'Blend up to 2 styles': 'styleBlend',
                    'Include style/expression negatives': 'includeNegatives',
                    'Randomize settings': 'randomizeSettings',
                    'Lock seed': 'lockSeed'
                  }).map(([label, key]) =>
                    React.createElement('label', { 
                      key: key,
                      className: 'flex items-center space-x-2 text-sm cursor-pointer'
                    },
                      React.createElement('input', {
                        type: 'checkbox',
                        checked: toggles[key],
                        onChange: (e) => setToggles({ ...toggles, [key]: e.target.checked }),
                        className: 'rounded bg-zinc-700 border-zinc-600 text-cyan-500 focus:ring-cyan-500'
                      }),
                      React.createElement('span', null, label)
                    )
                  )
                ),
                
                // LoRA count slider
                React.createElement('div', null,
                  React.createElement('label', { className: 'block text-sm font-medium mb-2' }, 
                    `LoRA count: ${loraCount} (typical 1-4)`
                  ),
                  React.createElement('input', {
                    type: 'range',
                    min: 0,
                    max: 5,
                    value: loraCount,
                    onChange: (e) => setLoraCount(parseInt(e.target.value)),
                    className: 'w-full h-2 bg-zinc-700 rounded-lg appearance-none cursor-pointer slider focus:ring-2 focus:ring-cyan-400'
                  })
                ),
                
                // Locks
                React.createElement('div', null,
                  React.createElement('h4', { className: 'text-sm font-medium mb-2' }, 'Lock per-bucket:'),
                  React.createElement('div', { className: 'grid grid-cols-3 gap-2' },
                    Object.entries({
                      'Subject': 'subject',
                      'Pose': 'pose', 
                      'Expression': 'expression',
                      'Location': 'location',
                      'Style': 'style'
                    }).map(([label, key]) =>
                      React.createElement('label', { 
                        key: key,
                        className: 'flex items-center space-x-1 text-xs cursor-pointer'
                      },
                        React.createElement('input', {
                          type: 'checkbox',
                          checked: locks[key],
                          onChange: (e) => setLocks({ ...locks, [key]: e.target.checked }),
                          className: 'rounded bg-zinc-700 border-zinc-600 text-cyan-500 focus:ring-cyan-500'
                        }),
                        React.createElement('span', null, label)
                      )
                    )
                  )
                ),
                
                // Main buttons
                React.createElement('div', { className: 'flex flex-wrap gap-2' },
                  React.createElement('button', {
                    className: 'px-6 py-3 bg-cyan-600 hover:bg-cyan-700 rounded-lg font-semibold transition-colors focus:ring-2 focus:ring-cyan-400',
                    onClick: generatePrompt
                  }, 'Generate Prompt'),
                  
                  // Re-roll buttons
                  ['Subject', 'Pose', 'Expression', 'Location', 'Style', 'LoRAs'].map(bucket =>
                    React.createElement('button', {
                      key: bucket,
                      className: `px-3 py-2 rounded text-xs transition-colors focus:ring-2 ${
                        bucket !== 'LoRAs' && locks[bucket.toLowerCase()] 
                          ? 'bg-zinc-800 text-zinc-500 cursor-not-allowed focus:ring-zinc-600' 
                          : 'bg-zinc-700 hover:bg-zinc-600 text-zinc-200 focus:ring-zinc-500'
                      }`,
                      onClick: () => rerollBucket(bucket.toLowerCase()),
                      disabled: bucket !== 'LoRAs' && locks[bucket.toLowerCase()]
                    }, `Re-roll ${bucket}`)
                  )
                )
              ),
              
              // Outputs
              React.createElement('div', { className: 'space-y-4' },
                React.createElement('h3', { className: 'text-lg font-semibold text-cyan-400' }, 'Outputs'),
                
                // Prompt
                React.createElement('div', null,
                  React.createElement('div', { className: 'flex justify-between items-center mb-2' },
                    React.createElement('label', { className: 'text-sm font-medium' }, 'Prompt'),
                    React.createElement('button', {
                      className: 'px-2 py-1 bg-zinc-700 hover:bg-zinc-600 rounded text-xs transition-colors focus:ring-2 focus:ring-zinc-500',
                      onClick: () => copyToClipboard(currentPrompt)
                    }, 'Copy')
                  ),
                  React.createElement('textarea', {
                    className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 font-mono text-sm resize-none focus:ring-2 focus:ring-cyan-400',
                    rows: 4,
                    value: currentPrompt,
                    readOnly: true
                  })
                ),
                
                // Negative Prompt
                React.createElement('div', null,
                  React.createElement('div', { className: 'flex justify-between items-center mb-2' },
                    React.createElement('label', { className: 'text-sm font-medium' }, 'Negative Prompt'),
                    React.createElement('button', {
                      className: 'px-2 py-1 bg-zinc-700 hover:bg-zinc-600 rounded text-xs transition-colors focus:ring-2 focus:ring-zinc-500',
                      onClick: () => copyToClipboard(currentNegative)
                    }, 'Copy')
                  ),
                  React.createElement('textarea', {
                    className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 font-mono text-sm resize-none focus:ring-2 focus:ring-cyan-400',
                    rows: 3,
                    value: currentNegative,
                    readOnly: true
                  })
                ),
                
                // Settings
                React.createElement('div', null,
                  React.createElement('div', { className: 'flex justify-between items-center mb-2' },
                    React.createElement('label', { className: 'text-sm font-medium' }, 'Settings'),
                    React.createElement('button', {
                      className: 'px-2 py-1 bg-zinc-700 hover:bg-zinc-600 rounded text-xs transition-colors focus:ring-2 focus:ring-zinc-500',
                      onClick: () => copyToClipboard(currentSettings)
                    }, 'Copy')
                  ),
                  React.createElement('textarea', {
                    className: 'w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100 font-mono text-sm resize-none focus:ring-2 focus:ring-cyan-400',
                    rows: 6,
                    value: currentSettings,
                    readOnly: true
                  })
                )
              ),
              
              // Export buttons
              React.createElement('div', { className: 'flex gap-2' },
                React.createElement('button', {
                  className: 'px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-colors focus:ring-2 focus:ring-green-400',
                  onClick: () => exportData('txt')
                }, 'Download .txt'),
                React.createElement('button', {
                  className: 'px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors focus:ring-2 focus:ring-blue-400',
                  onClick: () => exportData('json')
                }, 'Download .json')
              ),
              
              // History
              React.createElement('div', { className: 'bg-zinc-900 rounded-lg p-4' },
                React.createElement('h3', { className: 'text-lg font-semibold text-cyan-400 mb-3' }, 
                  `History (${history.length})`
                ),
                React.createElement('div', { className: 'max-h-64 overflow-y-auto space-y-2' },
                  history.map(entry =>
                    React.createElement('div', { 
                      key: entry.id,
                      className: 'p-2 bg-zinc-800 rounded text-sm'
                    },
                      React.createElement('div', { className: 'flex justify-between items-start mb-1' },
                        React.createElement('span', { className: 'text-xs text-zinc-400' },
                          new Date(entry.timestamp).toLocaleString()
                        ),
                        React.createElement('button', {
                          className: 'px-2 py-1 bg-cyan-600 hover:bg-cyan-700 rounded text-xs transition-colors focus:ring-2 focus:ring-cyan-400',
                          onClick: () => restoreFromHistory(entry)
                        }, 'Restore')
                      ),
                      React.createElement('div', { className: 'text-zinc-300 truncate' },
                        entry.prompt.slice(0, 100) + '...'
                      )
                    )
                  )
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
